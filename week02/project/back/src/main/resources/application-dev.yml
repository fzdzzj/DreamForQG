spring:
  datasource:
    # 复用 .env 中的数据库变量，避免硬编码
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=5000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

# 日志配置（开发环境可开启调试，生产环境关闭）
logging:
  level:
    org.springframework: DEBUG
    org.springframework.jdbc.support.JdbcTransactionManager: DEBUG
    com.qg.dormrepair: DEBUG
    com.aliyun.oss: WARN
    org.mybatis: warn

# 阿里云 OSS 配置（开发环境复用 .env 变量）
aliyun:
  oss:
    bucket-name: ${OSS_BUCKET_NAME:dongrespect}
