spring:
  application:
    name: dorm-repair
  # 激活的环境（从环境变量读取，默认 dev）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 移除无效占位符，统一由环境配置文件管理
    url: ""
    username: ""
    password: ""

# 服务器配置
server:
  port: ${SERVER_PORT:8080}

# 日志配置（区分环境，主配置只保留基础级别）
logging:
  level:
    root: ${LOG_LEVEL:INFO}


# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qg.dormrepair.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    auto-mapping-behavior: FULL

# JWT 配置
jwt:
  sign-key: ${JWT_SIGN_KEY:SVRIRUlNQQ==}
  expire: ${JWT_EXPIRE:86400000}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800000}
  refresh-sign-key: ${JWT_REFRESH_SIGN_KEY:SVRIRUlNQQ==}

# 阿里云 OSS 配置（基础配置，具体值由环境文件覆盖）
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:}
    region: ${OSS_REGION:cn-beijing}
    max-file-size: 10MB
    # 增加非空判断，避免拼接失败
    base-url: https://${OSS_BUCKET_NAME:default-bucket}.${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}/
    # 允许的文件类型（统一配置)
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain


springdoc:
  api-docs:
    path: /api-docs # 文档 JSON 路径
  swagger-ui:
    path: /swagger-ui.html # UI 访问路径
    operationsSorter: method # 接口按请求方法排序