# 所有环境共用
spring:
  application:
    name: dorm-repair
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 基础数据源配置（具体值由环境配置覆盖）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 基础配置
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379/10}

# ==============================
# 服务器配置
# ==============================
server:
  port: ${SERVER_PORT:8080}

# ==============================
# 日志基础配置
# ==============================
logging:
  level:
    root: ${LOG_LEVEL:INFO}

# MyBatis 核心配置
mybatis:
  # 1. Mapper XML 文件扫描路径
  mapper-locations: classpath:mapper/*.xml
  # 2. 实体类别名包扫描
  type-aliases-package: com.qg.dormrepair.pojo
  # 3. MyBatis 高级配置
  configuration:
    # 开启下划线转驼峰命名映射
    map-underscore-to-camel-case: true
    # 交给Spring日志管理
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 自动映射行为配置
    auto-mapping-behavior: FULL

# JWT 认证配置
jwt:
  sign-key: ${JWT_SIGN_KEY}
  expire: ${JWT_EXPIRE}
  refresh-expire: ${JWT_REFRESH_EXPIRE}
  refresh-sign-key: ${JWT_REFRESH_SIGN_KEY}

# 阿里云 OSS 基础配置
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}
    region: ${OSS_REGION:cn-beijing}
    max-file-size: 10MB
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain

# 接口文档配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method