spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 生产环境增加连接池配置，提升性能
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

# 日志配置（生产环境降低日志级别）
logging:
  level:
    root: WARN
    com.qg.dormrepair: INFO
    org.springframework: WARN

# 阿里云 OSS 配置（生产环境强制校验变量）
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:prod_oss_key_missing}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:prod_oss_secret_missing}
    bucket-name: ${OSS_BUCKET_NAME:prod_bucket_missing}

# application-prod.yml
springdoc:
  api-docs:
    enabled: false # 生产环境关闭文档